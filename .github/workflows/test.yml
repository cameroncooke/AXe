name: Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-tests:
    runs-on: xcode-27
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check released changelog sections are unchanged
        run: |
          base="${GITHUB_BASE_REF:-main}"
          git fetch --no-tags --depth=1 origin "$base"
          python3 -I scripts/check-changelog-released.py FETCH_HEAD

      - name: Run script checks
        run: python3 -I -m unittest discover -s scripts/tests

      - name: Run benchmark checks (offline; no simulator or model)
        run: python3 -I -m unittest discover -s benchmarks -p 'test_*.py'

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.2'

      - name: Install build dependencies
        run: brew install xcodegen

      - name: Run Swift tests
        run: ./test-runner.sh --unit-tests
