name: AXeMirror
options:
  deploymentTarget:
    iOS: "17.5"
packages:
  IrohFFI:
    url: https://github.com/n0-computer/iroh-ffi
    exactVersion: 1.2.0
targets:
  AXeMirror:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
      # The protocol files the app shares with the Mac's axe mirror command.
      - path: ../Sources/AXe/Mirror/Shared
    dependencies:
      - package: IrohFFI
        product: IrohLib
      - sdk: SystemConfiguration.framework
      - sdk: Network.framework
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: AXe Mirror
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.developer-tools
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The trust tutorial goes on playing in Picture in Picture while the person is in Settings.
        UIBackgroundModes:
          - audio
        NSCameraUsageDescription: AXe Mirror uses the camera to scan the pairing code shown on your Mac.
        NSLocalNetworkUsageDescription: AXe Mirror connects directly to your Mac when both are on the same network.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cameroncooke.axemirror
        PRODUCT_NAME: AXe Mirror
        DEVELOPMENT_TEAM: BR6WD3M6ZD
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: "31"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) AXE_MIRROR
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        GENERATE_INFOPLIST_FILE: NO
